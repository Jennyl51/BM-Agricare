<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BM-Agricare API Tester</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { margin-bottom: 20px; color: #e94560; }
        h2 { margin: 20px 0 10px; color: #0f3460; background: #e94560; padding: 8px; border-radius: 4px; }
        .section { background: #16213e; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
        label { display: block; margin: 6px 0 2px; font-size: 13px; color: #aaa; }
        input { width: 100%; padding: 8px; background: #0f3460; border: 1px solid #333; color: #eee; border-radius: 4px; margin-bottom: 4px; }
        button { padding: 8px 16px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
        button:hover { background: #c73650; }
        .response { background: #0f3460; padding: 12px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; font-size: 13px; max-height: 300px; overflow-y: auto; }
        .token-bar { background: #0f3460; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 12px; word-break: break-all; }
        .token-bar span { color: #e94560; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>BM-Agricare API Tester</h1>

    <div class="token-bar">
        <span>Access Token:</span>
        <span id="tokenDisplay">Not logged in</span>
    </div>

    <div class="grid">
        <!-- Signup -->
        <div class="section">
            <h2>POST /auth/signup</h2>
            <label>Username</label>
            <input id="signupUsername" value="testuser">
            <label>Password</label>
            <input id="signupPassword" type="password" value="TestPass123!">
            <label>Name</label>
            <input id="signupName" value="Test User">
            <label>Email</label>
            <input id="signupEmail" value="test@example.com">
            <label>Phone Number</label>
            <input id="signupPhone" value="+11234567890">
            <label>User Type</label>
            <input id="signupUserType" value="base">
            <button onclick="signup()">Sign Up</button>
            <div class="response" id="signupResponse"></div>
        </div>

        <!-- Login -->
        <div class="section">
            <h2>POST /auth/login</h2>
            <label>Username</label>
            <input id="loginUsername" value="testuser">
            <label>Password</label>
            <input id="loginPassword" type="password" value="TestPass123!">
            <button onclick="login()">Login</button>
            <div class="response" id="loginResponse"></div>
        </div>

        <!-- Get Me -->
        <div class="section">
            <h2>GET /users/me</h2>
            <button onclick="getMe()">Get My Profile</button>
            <div class="response" id="getMeResponse"></div>
        </div>

        <!-- Update Me -->
        <div class="section">
            <h2>PATCH /users/me</h2>
            <label>Email (optional)</label>
            <input id="updateEmail" placeholder="new@example.com">
            <label>User Type (optional)</label>
            <input id="updateUserType" placeholder="base">
            <button onclick="updateMe()">Update Profile</button>
            <div class="response" id="updateMeResponse"></div>
        </div>

        <!-- Admin: List Users -->
        <div class="section">
            <h2>GET /admin/users</h2>
            <button onclick="getAdminUsers()">List All Users</button>
            <div class="response" id="adminUsersResponse"></div>
        </div>

        <!-- Admin: Update User -->
        <div class="section">
            <h2>PATCH /admin/users/:id</h2>
            <label>User ID</label>
            <input id="adminUserId" placeholder="username or sub">
            <label>Email (optional)</label>
            <input id="adminUpdateEmail" placeholder="new@example.com">
            <label>User Type (optional)</label>
            <input id="adminUpdateUserType" placeholder="admin">
            <button onclick="updateAdminUser()">Update User</button>
            <div class="response" id="adminUpdateResponse"></div>
        </div>
    </div>

    <script>
        const API = "";  // same origin since served by FastAPI
        let accessToken = "";

        async function request(method, path, body, responseId) {
            const el = document.getElementById(responseId);
            el.textContent = "Loading...";
            try {
                const opts = {
                    method,
                    headers: { "Content-Type": "application/json" },
                };
                if (accessToken) opts.headers["Authorization"] = "Bearer " + accessToken;
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(API + path, opts);
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                    el.textContent = JSON.stringify(data, null, 2);
                } catch {
                    el.textContent = "Status: " + res.status + "\n" + text;
                }
                return data;
            } catch (e) {
                el.textContent = "Error: " + e.message;
            }
        }

        async function signup() {
            await request("POST", "/auth/signup", {
                username: document.getElementById("signupUsername").value,
                password: document.getElementById("signupPassword").value,
                name: document.getElementById("signupName").value,
                email: document.getElementById("signupEmail").value,
                phone_number: document.getElementById("signupPhone").value,
                user_type: document.getElementById("signupUserType").value,
            }, "signupResponse");
        }

        async function login() {
            const data = await request("POST", "/auth/login", {
                username: document.getElementById("loginUsername").value,
                password: document.getElementById("loginPassword").value,
            }, "loginResponse");
            if (data && data.access_token) {
                accessToken = data.access_token;
                document.getElementById("tokenDisplay").textContent = accessToken.substring(0, 50) + "...";
            }
        }

        async function getMe() {
            await request("GET", "/users/me", null, "getMeResponse");
        }

        async function updateMe() {
            const body = {};
            const email = document.getElementById("updateEmail").value;
            const userType = document.getElementById("updateUserType").value;
            if (email) body.email = email;
            if (userType) body.user_type = userType;
            await request("PATCH", "/users/me", body, "updateMeResponse");
        }

        async function getAdminUsers() {
            await request("GET", "/admin/users", null, "adminUsersResponse");
        }

        async function updateAdminUser() {
            const userId = document.getElementById("adminUserId").value;
            const body = {};
            const email = document.getElementById("adminUpdateEmail").value;
            const userType = document.getElementById("adminUpdateUserType").value;
            if (email) body.email = email;
            if (userType) body.user_type = userType;
            await request("PATCH", "/admin/users/" + userId, body, "adminUpdateResponse");
        }
    </script>
</body>
</html>
